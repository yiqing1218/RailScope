[package]
name = "railscope-next-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
csv = "1"
flate2 = "1"
geo = { version = "0.32", default-features = false }
geozero = { version = "0.15", default-features = false, features = ["with-wkb", "with-geojson", "with-geo"] }
lru = "0.18"
pmtiles = { version = "0.28.1", default-features = false }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tempfile = "3"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
